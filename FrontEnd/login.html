<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Connexion - Sophie Bluel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap"
        rel="stylesheet">
    <meta name="description" content="Connexion à l'espace administrateur de Sophie Bluel">
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body class="login-page">
    <header>
        <h1><a class="site-logo" href="./index.html">Sophie Bluel <span>Architecte d'intérieur</span></a></h1>
        <nav>
            <ul>
                <li><a href="./index.html#portfolio">projets</a></li>
                <li><a href="./index.html#contact">contact</a></li>
                <li><a href="./login.html" aria-current="page">login</a></li>
                <li><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><img
                            src="./assets/icons/instagram.png" alt="Instagram"></a></li>
            </ul>
        </nav>
    </header>
    <main class="login-main">
        <section id="login" aria-labelledby="login-title">
            <h2 id="login-title">Log In</h2>
            <form action="#" method="post">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" autocomplete="email">
                <label for="password">Mot de passe</label>
                <input type="password" name="password" id="password" autocomplete="current-password">
                <button type="button">Se connecter</button>
            </form>
            <a class="forgot-password" href="#">Mot de passe oublié</a>
        </section>
    </main>
    <footer class="login-footer">
        <nav>
            <ul>
                <li>Mentions Légales</li>
            </ul>
        </nav>
    </footer>
</body>

</html>
